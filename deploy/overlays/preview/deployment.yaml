apiVersion: apps/v1
kind: Deployment
metadata:
  name: levinkeller-de
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: levinkeller-de
  template:
    metadata:
      labels:
        app: levinkeller-de
    spec:
      # Eigener User-Namespace: root im Container ist auf dem Host kein root.
      hostUsers: false
      containers:
      - name: app
        image: ghcr.io/levino/levinkeller.de
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
