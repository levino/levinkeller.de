name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      # Build the PR head itself (default would be the merge commit), so the
      # image content matches the :pr-<n>-<head_sha> tag Argo deploys.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/levino/levinkeller.de:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      # Build the PR head itself (default would be the merge commit), so the
      # image content matches the :pr-<n>-<head_sha> tag Argo deploys.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/levino/levinkeller.de:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-arm64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64,mode=max

  # Pull-based: no cluster credentials here. An Argo CD ApplicationSet
  # (server-config repo) watches open PRs, deploys deploy/overlays/preview at the
  # PR's head commit with this image tag, and prunes it when the PR closes.
  # The job id stays `deploy-preview`: the main ruleset requires a status check
  # of that name.
  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    env:
      PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.levinkeller.de
      IMAGE: ghcr.io/levino/levinkeller.de:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag $IMAGE \
            $IMAGE-amd64 \
            $IMAGE-arm64

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployment')
            )
            const body = `### Preview deployment\n\nhttps://${{ env.PREVIEW_HOST }}\n\nImage \`${{ env.IMAGE }}\` is built. The preview appears once the label \`preview\` is set on this PR and Argo CD has synced it (typically within 1-3 minutes).`
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
