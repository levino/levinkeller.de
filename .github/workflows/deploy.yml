name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/levino/levinkeller.de:${{ github.sha }}-amd64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/levino/levinkeller.de:${{ github.sha }}-arm64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64,mode=max

  # Pull-based deploy: pin the production overlay to the immutable :<sha> tag we
  # just built and publish it to the 'production' branch, which Flux tracks. It
  # pulls the changed overlay and rolls the Deployment forward.
  #
  # Why a separate 'production' branch instead of committing back to main:
  # main is protected by a repository ruleset, and the built-in GITHUB_TOKEN
  # cannot be a ruleset bypass actor on a user-owned repo. So the bot cannot
  # push to main. 'production' is unprotected and exists only to carry
  # "main's tree + the image-tag pin"; it is force-updated on each deploy.
  # CI triggers only on main + PRs, so pushes to 'production' start no new run
  # (no build->commit->build loop). main stays fully protected; humans never
  # touch 'production'.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/levino/levinkeller.de:${{ github.sha }} \
            --tag ghcr.io/levino/levinkeller.de:latest \
            ghcr.io/levino/levinkeller.de:${{ github.sha }}-amd64 \
            ghcr.io/levino/levinkeller.de:${{ github.sha }}-arm64

      - name: Install kustomize
        run: curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Pin overlay to the freshly built :<sha> image
        working-directory: deploy/overlays/production
        run: |
          kustomize edit set image ghcr.io/levino/levinkeller.de=ghcr.io/levino/levinkeller.de:${{ github.sha }}

      - name: Publish pinned overlay to the GitOps 'production' branch
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy/overlays/production/kustomization.yaml
          git commit --allow-empty -m "chore(deploy): roll to ${{ github.sha }}"
          # Fully-qualified ref so the first push creates 'production' (git won't
          # guess a full refname for a branch that does not exist yet).
          git push --force origin HEAD:refs/heads/production
