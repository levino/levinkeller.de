name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/levino/levinkeller.de:${{ github.sha }}-amd64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/levino/levinkeller.de:${{ github.sha }}-arm64
          cache-from: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/levino/levinkeller.de:buildcache-arm64,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/levino/levinkeller.de:${{ github.sha }} \
            --tag ghcr.io/levino/levinkeller.de:latest \
            ghcr.io/levino/levinkeller.de:${{ github.sha }}-amd64 \
            ghcr.io/levino/levinkeller.de:${{ github.sha }}-arm64

      - name: Update image tag in kustomization
        run: |
          cd deploy/overlays/production
          kustomize edit set image ghcr.io/levino/levinkeller.de=ghcr.io/levino/levinkeller.de:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: deploy ${{ github.sha }} [skip ci]"
          git push
