server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Default ist de: die Seite ist deutschsprachig, und /en/ existiert nur als
    # Fallback-Weiterleitung. Mit en als Default landete jeder Besucher ohne
    # deutsche Accept-Language auf /en/ — inklusive aller Crawler, die den
    # Header gar nicht senden.
    location = / {
        set $lang de;
        if ($http_accept_language ~* "^en") {
            set $lang en;
        }
        return 302 /$lang/;
    }

    # Unter /en/ liegen nur wenige echte Seiten (blog, garden) — und die zeigen
    # denselben deutschen Text. Alle uebrigen englischen Routen gab es frueher
    # als von Astro erzeugte Weiterleitungs-Stubs nach /de/; seit dem Astro-6-
    # Upgrade erzeugt i18n.fallback diese Stubs nicht mehr (kein Config-Schalter
    # bringt sie zurueck). Fehlende englische Routen deshalb hier auf die
    # deutsche Entsprechung weiterleiten, statt 403/404 auszuliefern.
    location /en/ {
        try_files $uri ${uri}index.html @en_to_de;
    }

    location @en_to_de {
        rewrite ^/en/(.*)$ /de/$1 redirect;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
