title: Wiener Saftgulasch
servings: für 4 Personen
time: ca. 3 Std.
description: Rindsgulasch mit viel Zwiebeln und Paprika, lange geschmort, bis ein sämiger, glänzender Saft entsteht – ganz ohne Mehl.
process:
  action: mit Beilage und Essiggurken servieren
  with:
    - action:
        - ohne Deckel 15–20 Min. einkochen, bis sich rotes Fett absetzt, salzen
      with:
        - action:
            - mit ca. 500 ml Wasser knapp bedecken, aufkochen
            - zugedeckt bei kleiner Hitze 2–2½ Std. schmoren, ab und zu rühren
          with:
            - action: sofort mit Essig und 250 ml Wasser ablöschen
              with:
                - action: vom Herd ziehen, Paprika einrühren
                  with:
                    - action: Tomatenmark kurz mitrösten
                      with:
                        - action: 20–30 Min. goldbraun rösten
                          with:
                            - ingredient: 2 EL Schmalz oder Öl
                              action: im Topf erhitzen
                            - ingredient: 800 g Zwiebeln
                              action: in feine Streifen schneiden
                        - 1 EL Tomatenmark
                    - ingredient: 3 EL Paprika edelsüß
                      bowl: Paprika
                    - ingredient: 1 TL Paprika scharf
                      bowl: Paprika
                - 1 EL Weißweinessig
            - ingredient: 800 g Rindergulasch
              action: ggf. kleiner schneiden
              bowl: Fleisch
            - ingredient: 1 TL Kümmel
              action: im Mörser zerstoßen
              bowl: Fleisch
            - ingredient: 1 TL Majoran
              bowl: Fleisch
            - ingredient: 2 Knoblauchzehen
              action: fein hacken
              bowl: Fleisch
            - ingredient: ½ Bio-Zitrone
              action: Schale abreiben
              bowl: Fleisch
            - ingredient: 1 Lorbeerblatt
              bowl: Fleisch
            - ingredient: 1½ TL Salz
              bowl: Fleisch
    - Knödel, Semmeln oder Salzstangerl
    - Essiggurken
tips:
  - Das Fleisch wird nicht angebraten. Farbe und Geschmack kommen von den gut gerösteten Zwiebeln und dem Paprika, der nicht verbrennen darf.
  - Gulasch aus der Keule geht gut; Wadschinken macht den Saft sämiger. Zu dünner Saft? Eine rohe Kartoffel hineinreiben, 10 Min. mitkochen.
  - Schneller geht es mit 2–3 cm großen Würfeln (1½–2 Std.). Im Ofen bei 150–160 °C zugedeckt schmoren geht auch.
