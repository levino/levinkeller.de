title: Wiener Saftgulasch
servings: für 4 Personen
time: ca. 3 Std.
description: Rindsgulasch mit viel Zwiebeln und Paprika, lange geschmort, bis ein sämiger, glänzender Saft entsteht – ganz ohne Mehl.
process:
  action: mit Semmeln oder Salzstangerl und Essiggurken servieren
  with:
    - action:
        - Deckel abnehmen, Saft 15–20 Min. einkochen, bis sich oben rotes Fett absetzt
        - mit Salz abschmecken
      with:
        - action:
            - mit ca. 500 ml Wasser aufgießen, bis das Fleisch knapp bedeckt ist
            - aufkochen, zugedeckt bei kleiner Hitze 2–2½ Std. schmoren, bis das Fleisch weich ist
            - ab und zu umrühren, bei Bedarf Wasser nachgießen
          with:
            - action: sofort mit Essig und 250 ml Wasser ablöschen, einmal aufkochen
              with:
                - action: Topf vom Herd ziehen, Paprika einrühren
                  with:
                    - action: Tomatenmark 1–2 Min. mitrösten
                      with:
                        - action: bei mittlerer Hitze 20–30 Min. goldbraun rösten, öfter rühren
                          with:
                            - ingredient: 2 EL Schweineschmalz oder Öl
                              action: im großen Topf erhitzen
                            - ingredient: 800 g Zwiebeln
                              action: halbieren, in feine Streifen schneiden
                        - 1 EL Tomatenmark
                    - ingredient: 3 EL Paprikapulver edelsüß
                      bowl: Paprika
                    - ingredient: 1 TL Paprikapulver scharf
                      bowl: Paprika
                - 1 EL Weißweinessig
            - ingredient: 800 g Rindergulasch
              action: ggf. auf ca. 4 cm Würfel nachschneiden
              bowl: Fleisch
            - ingredient: 1 TL Kümmel
              action: im Mörser zerstoßen
              bowl: Fleisch
            - ingredient: 1 TL getrockneter Majoran
              bowl: Fleisch
            - ingredient: 2 Knoblauchzehen
              action: fein hacken
              bowl: Fleisch
            - ingredient: Schale von ½ Bio-Zitrone
              action: fein abreiben
              bowl: Fleisch
            - ingredient: 1 Lorbeerblatt
              bowl: Fleisch
            - ingredient: 1½ TL Salz
              bowl: Fleisch
    - Semmeln oder Salzstangerl
    - Essiggurken
tips:
  - Das Fleisch wird beim Saftgulasch nicht angebraten – es kommt roh zu den Zwiebeln. Die Farbe und der Geschmack kommen von den gut gerösteten Zwiebeln und dem Paprika.
  - Paprikapulver verbrennt schnell und wird dann bitter. Deshalb den Topf vom Herd ziehen und sofort ablöschen.
  - Normales Rindergulasch aus der Keule funktioniert gut. Wadschinken (Beinscheibe ohne Knochen) hat mehr Bindegewebe und macht den Saft noch sämiger. Ist der Saft am Ende zu dünn, eine kleine rohe Kartoffel fein hineinreiben und 10 Min. mitkochen.
  - Wenn es schneller gehen muss, das Fleisch in 2–3 cm große Würfel schneiden. Dann reichen etwa 1½–2 Std. Schmorzeit.
  - Aufgewärmt am nächsten Tag schmeckt das Gulasch noch besser.
