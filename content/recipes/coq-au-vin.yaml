title: Coq au vin
servings: für 4 Personen
time: ca. 2 Std.
description: Französisches Schmorhuhn in Rotwein mit Räucherspeck, Champignons und Zwiebeln.
process:
  action:
    - mit gehackter Petersilie bestreuen
    - mit Baguette, Kartoffelpüree oder Bandnudeln servieren
  with:
    - action:
        - Mehlbutter in die Sauce rühren
        - ca. 5 Min. köcheln, bis die Sauce sämig ist
        - mit Salz und Pfeffer abschmecken
      with:
        - action:
            - zugedeckt bei schwacher Hitze ca. 45 Min. schmoren
            - Pilze nach 30 Min. zugeben
            - Brustfilets (falls dabei) erst die letzten 15 Min. mitgaren
          with:
            - action:
                - mit Cognac ablöschen (optional)
                - Wein und Fond angießen, aufkochen
                - Huhn zurück in den Topf legen
              with:
                - action:
                    - Zwiebeln, Möhren und Knoblauch im Speckfett ca. 5 Min. anbraten
                    - Tomatenmark kurz mitrösten
                  with:
                    - ingredient: 150 g geräucherter Bauchspeck
                      action: in Streifen schneiden, im Schmortopf knusprig auslassen, herausnehmen
                    - ingredient: 12 kleine Schalotten oder Perlzwiebeln
                      action: schälen
                    - ingredient: 2 Möhren
                      action: schälen, in Scheiben schneiden
                    - ingredient: 2 Knoblauchzehen
                      action: andrücken
                    - 1 EL Tomatenmark
                - ingredient: 1 Huhn (ca. 1,5 kg)
                  action:
                    - in 8 Stücke teilen, salzen, pfeffern
                    - in Butterschmalz rundum anbraten, herausnehmen
                - 3 EL Cognac (optional)
                - 750 ml kräftiger Rotwein (z. B. Pinot Noir)
                - 400 ml Geflügelfond
                - 3 Zweige Thymian
                - 2 Lorbeerblätter
            - action: in Butter goldbraun braten
              with:
                - ingredient: 250 g Champignons
                  action: halbieren
                - 1 EL Butter
            - ingredient: 2 Hähnchenbrustfilets (optional)
              action: separat kurz anbraten
        - action: zu Mehlbutter verkneten
          with:
            - 1 EL Mehl
            - 1 EL weiche Butter
    - 1 Handvoll Petersilie, gehackt
    - Baguette, Kartoffelpüree oder Bandnudeln
tips:
  - Das Huhn über Nacht im Rotwein marinieren, dann wird es aromatischer und die Sauce schöner in der Farbe.
  - Geräucherten Bauchspeck am Stück kaufen und selbst schneiden. Stark geräucherter Schinkenspeck kann die Sauce dominieren.
  - Hähnchenbrustfilets werden schnell trocken. Separat anbraten und nur die letzten 15 Min. in der Sauce ziehen lassen.
